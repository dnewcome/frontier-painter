<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Frontier Painter</title>
    <meta name="description" content="Repair a failing generation ship by painting physics back onto reality." />
    <meta name="theme-color" content="#05080f" />
    <!-- Home-screen app: fullscreen, no browser chrome, translucent status bar. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Frontier" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: system-ui, -apple-system, sans-serif;
        /* No iOS rubber-band / pull-to-refresh / text selection on the game. */
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-text-size-adjust: 100%;
      }
      body {
        position: fixed;
        inset: 0;
      }
      #renderCanvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        outline: none;
      }
      #hud {
        position: fixed;
        top: 0;
        left: 0;
        padding: 10px 12px;
        color: #cfe8ff;
        font-size: 13px;
        line-height: 1.4;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        pointer-events: none;
        white-space: pre;
        z-index: 10;
      }
      #hud .win-banner {
        display: none;
        margin-top: 8px;
        padding: 6px 10px;
        background: rgba(0, 160, 80, 0.85);
        color: #fff;
        font-weight: 700;
        border-radius: 4px;
      }
      #hud.won .win-banner {
        display: inline-block;
      }
      /* ---- phone HUD: compact objective panel, top-center ---- */
      #hud.compact {
        left: 50%;
        transform: translateX(-50%);
        top: max(8px, env(safe-area-inset-top));
        padding: 0;
        white-space: normal;
        font-size: 12px;
        max-width: min(46vw, 420px);
      }
      /* Tablets: larger objective text (matches the touch UI's iPad scale-up). */
      @media (min-width: 1000px) and (min-height: 700px) {
        #hud.compact {
          font-size: 15px;
          max-width: min(46vw, 540px);
        }
        #hud .obj-title { font-size: 13px; }
        #hud .obj-room { font-size: 12px; }
      }
      #hud.compact .hud-info,
      #hud.compact .win-banner {
        display: none !important;
      }
      #hud .hud-objective:empty {
        display: none;
      }
      #hud .hud-objective {
        background: rgba(6, 12, 24, 0.62);
        border-radius: 12px;
        padding: 8px 12px;
      }
      #hud .obj-title {
        font-weight: 700;
        letter-spacing: 0.1em;
        font-size: 11px;
        opacity: 0.8;
        margin-bottom: 4px;
        text-align: center;
      }
      #hud .obj-title.go {
        color: #4fe08a;
        opacity: 1;
      }
      #hud .obj-room {
        font-size: 10px;
        letter-spacing: 0.08em;
        opacity: 0.55;
        text-align: center;
        margin-bottom: 2px;
      }
      #hud .obj-row {
        display: flex;
        gap: 6px;
        align-items: baseline;
        margin-top: 2px;
      }
      #hud .obj-row .ic {
        width: 1.2em;
        text-align: center;
      }
      #hud .obj-row .sym {
        opacity: 0.8;
        font-weight: 400;
      }
      #hud .obj-row.ok .ic { color: #4fe08a; }
      #hud .obj-row.bad .ic { color: #ff8a4d; }
      #hud .obj-row.ok .sym { color: #4fe08a; }
      /* ---- rotate-to-landscape prompt (phones in portrait) ---- */
      #rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 50;
        background: #05080f;
        color: #cfe8ff;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 14px;
        text-align: center;
        font-size: 16px;
      }
      #rotate-hint .phone {
        width: 44px;
        height: 76px;
        border: 3px solid #8cd9ff;
        border-radius: 9px;
        animation: fp-rotate 1.8s ease-in-out infinite;
      }
      @keyframes fp-rotate {
        0%, 25% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(-90deg); }
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate-hint {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <div id="hud"></div>
    <div id="rotate-hint"><div class="phone"></div>Rotate your phone to play</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
